name: friends-auction

x-app: &app
  image: friends-auction:local
  build:
    context: .
    args:
      SOURCE_COMMIT: ${AUCTION_SOURCE_COMMIT:-}
  environment:
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:?Set TELEGRAM_ADMIN_ID in .env}
    AUCTION_DB: /app/data/auction.sqlite3
    AUCTION_UPLOADS: /app/data/photos
    AUCTION_BACKUPS: /app/data/backups
    AUCTION_DEMO: "0"
    AUCTION_TRIAL: "0"
    AUCTION_BOT_POLL: ${AUCTION_BOT_POLL:-0}
    AUCTION_APP_URL: ${AUCTION_APP_URL:-}
  volumes:
    - auction-data:/app/data
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  stop_grace_period: 30s

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${AUCTION_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "auction.worker"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    # Retention cleanup exits successfully and must not trigger a restart loop.
    restart: "on-failure:5"

volumes:
  auction-data:
